specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Unit
providerId: unit-co
created: '2026-07-02'
modified: '2026-07-02'
reconciled: false
tags:
- FinTech
- BaaS
- Banking
- Card Issuing
- ACH
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Unit spend. Unit is a Banking-as-a-Service platform sold
  under a negotiated production contract (no public price list); sandbox
  usage is free. Production cost drivers are a platform/minimum fee,
  per-transaction and per-card fees, ACH/wire network and processor
  pass-through, and a revenue share on card interchange and account
  interest that flows the other direction (from Unit to the customer's
  program) net of Unit's share. Programs typically span multiple cost
  centers - onboarding/KYC volume, active accounts, active cards,
  transaction/payment throughput, and dispute/fraud handling.
notes: >-
  Rates are not reconciled here; confirm current commercial terms with a
  Unit solution engineer. FOCUS alignment below is directional, mapping
  Unit's billing concepts onto FOCUS columns for cross-provider cost
  reporting.
sources:
- https://www.unit.co/
- https://www.unit.co/docs/api/
- https://www.unit.co/docs/cards/interchange/
