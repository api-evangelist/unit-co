meters:
- name: applications_processed
  description: Individual and business applications submitted for onboarding/KYC review.
  unit: application
  aggregation: sum
  dimensions:
  - org
  - application_type
- name: active_accounts
  description: Open deposit and credit accounts under management.
  unit: account
  aggregation: max
  dimensions:
  - org
  - account_type
- name: active_cards
  description: Active debit and credit cards issued.
  unit: card
  aggregation: max
  dimensions:
  - org
  - card_product
- name: transactions_processed
  description: Posted ledger transactions across payments, cards, and checks.
  unit: transaction
  aggregation: sum
  dimensions:
  - org
  - account_type
- name: ach_wire_transfers
  description: ACH and wire payments originated or received.
  unit: transfer
  aggregation: sum
  dimensions:
  - org
  - rail
- name: interchange_revenue_share
  description: Unit's contractual share retained from gross card interchange.
  unit: usd
  aggregation: sum
  dimensions:
  - org
- name: dispute_fraud_cases
  description: Card disputes and fraud outreach cases handled.
  unit: case
  aggregation: sum
  dimensions:
  - org
principles:
- name: Visibility
  description: >-
    Pull the Transactions, Statements, and Events APIs on a schedule to
    attribute Unit-driven activity (and therefore fee exposure) to internal
    cost centers and end customers.
- name: Allocation
  description: >-
    Use Unit's tags attribute on applications, accounts, and payments to
    attribute per-transaction and per-card fees to the correct product line
    or business unit.
- name: Optimization
  description: >-
    Favor Book Payments (free, instant, internal) over ACH/wire where funds
    stay on Unit's ledger; batch and filter Events/webhook subscriptions to
    avoid unnecessary downstream processing costs.
- name: Accountability
  description: >-
    Assign a program owner to review monthly Unit invoices against contract
    minimums, active account/card counts, and interchange revenue share
    reconciliation.
