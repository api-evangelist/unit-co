aid: unit-co
url: https://raw.githubusercontent.com/api-evangelist/unit-co/refs/heads/main/apis.yml
name: Unit
kind: company
description: Unit is a Banking-as-a-Service (BaaS) platform that lets companies embed deposit accounts,
  cards, payments, and lending into their own products without becoming a bank. A single REST API, built
  on the JSON:API specification (media type application/vnd.api+json) and secured with Bearer/JWT tokens,
  covers onboarding (Applications), Customers, Deposit and Credit Accounts, Debit and Credit Cards, real-time
  card Authorizations, Payments (Book, ACH, Wire, Recurring, Cash Deposits), Counterparties, Checks, Transactions,
  Statements, Tax Forms, Fees, Rewards, Credit and Repayments, and Events delivered as signed HTTP webhooks.
  Unit publishes an official OpenAPI 3.0.2 specification (github.com/unit-finance/openapi-unit-sdk) plus
  generated Node.js, Python, Ruby, and Java SDKs. Sandbox runs at api.s.unit.sh; production access is
  provisioned per signed BaaS agreement with Unit's partner banks.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/unit-co.png
tags:
- FinTech
- BaaS
- Banking
- Payments
- Card Issuing
- ACH
- Lending
- JSON:API
created: '2026-07-02'
modified: '2026-08-08'
