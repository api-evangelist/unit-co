media_type:
  standard: JSON:API
  content_type: application/vnd.api+json
  spec: https://jsonapi.org/format/
  structure: Every request/response is a JSON:API document with a top-level `data` (single resource object or array) or `errors`. Resource objects carry `type`, `id`, `attributes`, and `relationships`.
idempotency:
  supported: true
  mechanism: Client-supplied idempotency key
  key_format: Any string up to 255 characters; UUID v4 recommended.
  retention: 48 hours from first successful use, after which keys are recycled.
  cross_operation: 'Keys are not shared between different API operations. Exception: physical and virtual debit card creation share the idempotency key.'
  docs: https://www.unit.co/docs/api/using-the-api#intro-idempotency
  scope_text: Supported on sensitive write operations (e.g. creating payments).
  coverage: partial
  scope:
  - createAccount
  - createPayment
  scope_basis: operations whose request body schema declares the idempotencyKey attribute in the local OpenAPI (derived 2026-10-12); docs say "Some of our API operations support request idempotency"
pagination:
  style: offset
  params:
    limit: page[limit]
    offset: page[offset]
  docs: https://www.unit.co/docs/api/using-the-api#intro-pagination
including_related:
  param: include
  description: GET operations on certain resources accept a comma-separated `include` query param; related resources are returned under a top-level `included` key.
full_text_search:
  supported: true
  operators:
    and: unquoted words
    or: OR
    not: '-'
