actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on Unit's own API, and no
    server-push transport (WebSocket or SSE) exists to model in AsyncAPI -
    Unit's realtime behavior (events, authorization requests) is delivered
    as Unit-initiated HTTP POST callbacks to a subscriber's own endpoint,
    which is a webhook pattern rather than a persistent streaming
    connection. apis.yml was built directly from Unit's officially
    published OpenAPI specification, organized into 15 logical API
    groupings for this catalog entry.
