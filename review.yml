aid: unit-co
name: Unit
review:
  question: Does Unit expose a documented public WebSocket API?
  answer: false
  date: '2026-07-02'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Unit's own public API surface is
    request/response REST over HTTPS, following the JSON:API specification
    (application/vnd.api+json). There is no server-push transport (WebSocket
    or Server-Sent Events) on Unit's own API to model. Unit's real-time
    behavior is delivered two ways instead: (1) Events are pushed out as
    signed HTTP POST callbacks to a Webhook subscription's configured URL,
    and (2) card Authorization Requests are delivered as a synchronous HTTP
    POST to a configured webhook URL that must respond within a short
    window with an approve/decline decision. Both are HTTP request/response
    patterns initiated by Unit against a merchant-hosted endpoint, not a
    persistent bidirectional WebSocket connection.
findings:
  summary: |
    Unit does not publish a documented public WebSocket API. Unit is a
    Banking-as-a-Service platform whose REST API follows the JSON:API
    specification - every request and response uses the
    application/vnd.api+json media type, wraps resources in a top-level
    `data` object, and authenticates with a Bearer JWT (an org API token or
    a customer API token). The confirmed sandbox host is
    https://api.s.unit.sh (the default `servers` entry in Unit's own
    published OpenAPI specification); a production host of
    https://api.unit.co is the standard convention paired with that
    sandbox host but was not independently re-confirmed against a live
    docs page in this research pass. Unit's "real-time" surface is built
    entirely on HTTP: Events (e.g. application.created, account.frozen,
    card.authorization) are recorded internally and, when a matching
    Webhook subscription exists, delivered as an HMAC-signed HTTP POST to
    the subscriber's URL (the signature is computed as an HMAC-SHA1 hash of
    the request body, base64-encoded, and passed in an X-Unit-Signature
    header). Separately, real-time card Authorization Requests are pushed
    to a configured webhook endpoint so the merchant can approve or decline
    a card swipe inline, using a fixed set of decline reasons
    (AccountClosed, CardExceedsAmountLimit, DoNotHonor, InsufficientFunds,
    InvalidMerchant, ReferToCardIssuer, RestrictedCard,
    TransactionNotPermittedToCardholder). No realtime, bidirectional
    WebSocket (ws:// or wss://) endpoint is documented anywhere in Unit's
    API reference, its officially published OpenAPI 3.0.2 specification
    (github.com/unit-finance/openapi-unit-sdk), or its generated Node.js,
    Python, Ruby, and Java SDKs.
  openApiSpec: |
    Unlike several other providers reviewed in this network, Unit
    officially publishes and maintains a real OpenAPI 3.0.2 specification
    at github.com/unit-finance/openapi-unit-sdk (root file openapi.json,
    spec-internal version 0.4.0), split into per-resource path/schema
    files under schemas/, and uses it to generate official Node.js
    (@unit-finance/unit-node-sdk), Python (unit-python-sdk), Ruby, and Java
    client libraries via openapi-generator. This research pass fetched
    that spec directly and confirmed 117 distinct path entries covering
    every resource category listed below; the openapi/unit-co-openapi.yml
    file in this repository is an API Evangelist re-typed consolidation of
    that confirmed path/method surface (condensed request/response schemas
    for readability), not the raw upstream file.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.s.unit.sh
      documented: true
      note: >-
        Confirmed as the default `servers` entry in Unit's published
        OpenAPI specification and in every code sample across Unit's docs
        and SDK READMEs.
    - protocol: REST
      scheme: https
      baseURL: https://api.unit.co
      documented: false
      note: >-
        Referenced as the production host by convention (and by a prior,
        thinner catalog entry for this company already in this network,
        aid `unit`), but not independently re-confirmed against a live
        Unit docs page during this research pass.
    - protocol: Webhook
      scheme: https
      documented: true
      note: >-
        Event and Authorization Request delivery: Unit issues an HTTP POST
        to a subscriber-configured URL, HMAC-SHA1-signed via
        X-Unit-Signature. Server-to-endpoint HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: >-
        No WebSocket endpoint is documented in Unit's API reference,
        published OpenAPI spec, or SDKs as of the review date.
