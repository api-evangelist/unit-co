openapi: 3.0.3
info:
  title: Unit API
  description: >-
    Unit is a Banking-as-a-Service (BaaS) platform. This document is an
    API Evangelist consolidation of Unit's public REST surface, organized
    into logical groupings (Applications, Customers, Accounts, Cards,
    Authorizations, Payments, Counterparties, Checks, Transactions,
    Statements, Tax Forms, Events, Webhooks, Risk/Fraud, Credit/Repayments,
    Fees, Rewards, and API Tokens). All paths, methods, and the request/
    response envelope below were confirmed against Unit's officially
    published OpenAPI 3.0.2 specification at
    github.com/unit-finance/openapi-unit-sdk (openapi.json, version 0.4.0);
    request/response bodies here are condensed and re-typed for readability
    rather than reproduced schema-for-schema. Unit's API follows the
    JSON:API specification - every request and response uses the
    `application/vnd.api+json` media type, wraps the primary resource in a
    top-level `data` object with `type`/`id`/`attributes`/`relationships`,
    and authenticates with a Bearer JWT obtained as an org API token or a
    customer API token.
  version: '1.0'
  contact:
    name: Unit
    url: https://www.unit.co
  license:
    name: Proprietary
    url: https://www.unit.co/legal/
servers:
  - url: https://api.s.unit.sh
    description: Sandbox (confirmed - default server in Unit's published OpenAPI spec)
  - url: https://api.unit.co
    description: >-
      Production (industry-standard Unit convention paired with the sandbox
      host; not independently re-confirmed against a live docs page in this
      research pass - verify with your Unit solution engineer)
security:
  - bearerAuth: []
tags:
  - name: Applications
    description: Individual and business application onboarding (KYC/KYB).
  - name: Customers
    description: Customer profiles created from approved applications.
  - name: Accounts
    description: Deposit and credit accounts.
  - name: Cards
    description: Debit and credit card issuance and management.
  - name: Authorizations
    description: Completed card authorizations and real-time authorization requests.
  - name: Payments
    description: Book, ACH, wire, recurring, and cash-deposit payments.
  - name: Counterparties
    description: External bank accounts and routing-number institution lookups.
  - name: Checks
    description: Check deposits and outbound check payments.
  - name: Transactions
    description: Posted, immutable ledger entries.
  - name: Statements
    description: Monthly account statements.
  - name: Tax Forms
    description: Annual tax documents.
  - name: Events
    description: Platform activity log.
  - name: Webhooks
    description: Subscriptions that deliver events as signed HTTP callbacks.
  - name: Risk and Fraud
    description: Stop payments and card/ACH disputes.
  - name: Credit and Repayments
    description: Repayments on credit accounts and receivables.
  - name: Fees and Rewards
    description: Ad hoc fees and cashback-style rewards.
  - name: API Tokens
    description: Org-level and customer-level authentication tokens.
paths:
  /applications:
    get:
      operationId: getApplicationsList
      tags: [Applications]
      summary: Get List Application
      description: Lists individual and business applications with filtering, sorting, and paging.
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
        - name: filter[status]
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [AwaitingDocuments, PendingReview, Pending, Approved, Denied, Canceled]
      responses:
        '200':
          $ref: '#/components/responses/ResourceList'
        default:
          $ref: '#/components/responses/DefaultError'
    post:
      operationId: createApplication
      tags: [Applications]
      summary: Create Application
      description: Creates an individualApplication or businessApplication resource.
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          $ref: '#/components/responses/SingleResource'
        default:
          $ref: '#/components/responses/DefaultError'
  /applications/{applicationId}:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      operationId: getApplication
      tags: [Applications]
      summary: Get Application by Id
      responses:
        '200':
          $ref: '#/components/responses/SingleResource'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateApplication
      tags: [Applications]
      summary: Update Application
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/SingleResource'
  /applications/{applicationId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      operationId: cancelApplication
      tags: [Applications]
      summary: Cancel Application by Id
      responses:
        '200':
          $ref: '#/components/responses/SingleResource'
  /applications/{applicationId}/documents:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      operationId: getApplicationDocuments
      tags: [Applications]
      summary: Get List of Documents
      responses:
        '200':
          $ref: '#/components/responses/ResourceList'
    post:
      operationId: createApplicationDocument
      tags: [Applications]
      summary: Create an application document
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
      responses:
        '201':
          $ref: '#/components/responses/SingleResource'
  /applications/{applicationId}/documents/{documentId}/multipart:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/DocumentId'
    put:
      operationId: uploadApplicationDocumentFile
      tags: [Applications]
      summary: Upload an application document file (PDF, PNG, JPG)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          $ref: '#/components/responses/SingleResource'
  /applications/{applicationId}/documents/{documentId}/verify:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/DocumentId'
    put:
      operationId: verifyDocument
      tags: [Applications]
      summary: Verify a document
      responses:
        '200':
          $ref: '#/components/responses/SingleResource'
  /applications/{applicationId}/documents/{documentId}/download:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: downloadDocument
      tags: [Applications]
      summary: Download a Document
      responses:
        '200':
          description: The document file.
          content:
            application/pdf: {}
            image/png: {}
            image/jpeg: {}
  /applications/{applicationId}/missing-fields:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      operationId: getApplicationMissingFields
      tags: [Applications]
      summary: Get Missing Fields by Application ID
      responses:
        '200':
          $ref: '#/components/responses/SingleResource'
  /application-forms:
    get:
      operationId: getApplicationFormsList
      tags: [Applications]
      summary: Get List Application Forms
      responses:
        '200':
          $ref: '#/components/responses/ResourceList'
    post:
      operationId: createApplicationForm
      tags: [Applications]
      summary: Create Application Form
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
      responses:
        '201':
          $ref: '#/components/responses/SingleResource'
  /application-forms/{applicationFormId}:
    parameters:
      - name: applicationFormId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getApplicationForm
      tags: [Applications]
      summary: Get ApplicationForm by Id
      responses:
        '200':
          $ref: '#/components/responses/SingleResource'
  /beneficial-owner/{beneficialOwnerId}:
    parameters:
      - name: beneficialOwnerId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateBusinessBeneficialOwner
      tags: [Applications]
      summary: Update a Business Beneficial Owner via API
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/SingleResource'
  /customers:
    get:
      operationId: getCustomersList
      tags: [Customers]
      summary: Get Customers List
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          $ref: '#/components/responses/ResourceList'
  /customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      operationId: getCustomer
      tags: [Customers]
      summary: Get Customer by Id
      responses:
        '200':
          $ref: '#/components/responses/SingleResource'
    patch:
      operationId: updateCustomer
      tags: [Customers]
      summary: Update Customer
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/SingleResource'
  /customers/{customerId}/archive:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    post:
      operationId: archiveCustomer
      tags: [Customers]
      summary: Archive Customer by Id
      responses:
