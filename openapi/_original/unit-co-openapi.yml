                type: string
              detail:
                type: string
    CreateApplicationRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes]
          properties:
            type:
              type: string
              enum: [individualApplication, businessApplication]
            attributes:
              type: object
              additionalProperties: true
    CreateAccountRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes, relationships]
          properties:
            type:
              type: string
              enum: [depositAccount, creditAccount]
            attributes:
              type: object
              properties:
                depositProduct:
                  type: string
                tags:
                  type: object
                  additionalProperties:
                    type: string
                idempotencyKey:
                  type: string
            relationships:
              type: object
              properties:
                customer:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [customer]
                        id:
                          type: string
    CreateCardRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, relationships]
          properties:
            type:
              type: string
              enum:
                - individualDebitCard
                - individualVirtualDebitCard
                - businessDebitCard
                - businessVirtualDebitCard
                - individualCreditCard
                - businessCreditCard
            attributes:
              type: object
              properties:
                shippingAddress:
                  $ref: '#/components/schemas/Address'
            relationships:
              type: object
              properties:
                account:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [depositAccount, creditAccount]
                        id:
                          type: string
    CreatePaymentRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes]
          properties:
            type:
              type: string
              enum: [bookPayment, achPayment, wirePayment]
            attributes:
              type: object
              properties:
                amount:
                  type: integer
                  description: Amount in cents.
                direction:
                  type: string
                  enum: [Credit, Debit]
                description:
                  type: string
                idempotencyKey:
                  type: string
    CreateWebhookRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes]
          properties:
            type:
              type: string
              enum: [webhook]
            attributes:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                secret:
                  type: string
                  description: >-
                    Signing secret; Unit computes an HMAC-SHA1 hash of the
                    request body, base64-encodes it, and sends it in the
                    X-Unit-Signature header.
    Address:
      type: object
      properties:
        street:
