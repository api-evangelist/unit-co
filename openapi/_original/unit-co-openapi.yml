        '200':
          $ref: '#/components/responses/SingleResource'
    delete:
      operationId: removeAuthorizedUsers
      tags: [Customers]
      summary: Remove Authorized Users by Id
      responses:
        '200':
          $ref: '#/components/responses/SingleResource'
  /accounts:
    get:
      operationId: getAccountsList
      tags: [Accounts]
      summary: Get List Accounts
      parameters:
        - $ref: '#/components/parameters/PageLimit'
