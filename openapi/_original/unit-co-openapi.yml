      - $ref: '#/components/parameters/CardId'
    get:
      operationId: getCardPinStatus
      tags: [Cards]
      summary: Get Card PIN Status
      responses:
        '200':
          $ref: '#/components/responses/SingleResource'
  /atm-locations:
    get:
      operationId: getAtmLocationsList
      tags: [Cards]
      summary: Get List of ATM Locations
      parameters:
        - name: latitude
          in: query
          schema:
            type: number
        - name: longitude
          in: query
          schema:
            type: number
      responses:
        '200':
          $ref: '#/components/responses/ResourceList'
  /authorizations:
    get:
      operationId: getAuthorizationsList
      tags: [Authorizations]
      summary: Get List authorizations
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          $ref: '#/components/responses/ResourceList'
  /authorizations/{authorizationId}:
    parameters:
      - name: authorizationId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAuthorization
      tags: [Authorizations]
      summary: Get Authorization by Id
      responses:
        '200':
          $ref: '#/components/responses/SingleResource'
  /authorization-requests:
    get:
      operationId: getAuthorizationRequestsList
      tags: [Authorizations]
      summary: Get List Authorization Requests
      responses:
        '200':
          $ref: '#/components/responses/ResourceList'
  /authorization-requests/{authorizationId}:
    parameters:
      - name: authorizationId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAuthorizationRequest
      tags: [Authorizations]
      summary: Get Authorization Request by Id
      responses:
        '200':
          $ref: '#/components/responses/SingleResource'
  /authorization-requests/{authorizationId}/approve:
    parameters:
      - name: authorizationId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: approveAuthorizationRequest
      tags: [Authorizations]
      summary: Approve Authorization Request by Id
      responses:
        '200':
          $ref: '#/components/responses/SingleResource'
  /authorization-requests/{authorizationId}/decline:
    parameters:
      - name: authorizationId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: declineAuthorizationRequest
      tags: [Authorizations]
      summary: Decline Authorization Request
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        reason:
                          type: string
                          enum:
                            - AccountClosed
                            - CardExceedsAmountLimit
                            - DoNotHonor
                            - InsufficientFunds
                            - InvalidMerchant
                            - ReferToCardIssuer
                            - RestrictedCard
                            - TransactionNotPermittedToCardholder
