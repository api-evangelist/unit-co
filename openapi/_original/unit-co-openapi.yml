        '200':
          $ref: '#/components/responses/SingleResource'
  /accounts/{accountId}/deactivate-daca:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      operationId: deactivateDaca
      tags: [Accounts]
      summary: Deactivate Deposit Account Control Agreement by Id
