description: >-
  NACHA ACH return reason codes recognized by Unit for both originated and received
  ACH payments. A return fires the payment.returned webhook event and creates an
  offsetting Returned ACH Transaction. The `reason` string is used when returning a
  Received ACH transaction (returnReceivedACHTransaction, POST /returns/{transactionId}).
envelope_field: reason
