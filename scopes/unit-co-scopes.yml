source: https://www.unit.co/docs/api/using-the-api
docs: https://www.unit.co/docs/api/using-the-api#scopes
note: >-
  Unit authenticates with OAuth 2.0 Bearer tokens (Org API tokens and short-lived
  Customer tokens). Each token is minted with a set of scopes granting read/write
  access per resource. The OpenAPI declares the transport as http bearer (JWT); the
  scope catalog below is documented in the "Scopes" section of the docs, not in the
  spec's securitySchemes. Fund-movement and PCI-sensitive scopes require Two-Factor
  Authentication (OTP) within the prior 24 hours; Customer tokens execute the 2FA for you.
token_types:
  - name: Org API token
    role: org
    description: Broad, system-level token not restricted to a specific end customer.
  - name: Customer token
    role: customer
    description: >-
      End-customer specific, scoped to a single customer's resources, with built-in
      OTP 2FA and a customizable expiry up to 24 hours. Required for PCI-sensitive
      card data/actions unless the client is PCI Level 1 compliant.
scopes:
